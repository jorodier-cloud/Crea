name: Deploiement

# Deploie l API sur Cloudflare Workers sans terminal : tout se pilote depuis
# GitHub. Declenchable a la main depuis l onglet Actions, y compris sur mobile.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deux deploiements simultanes se marcheraient dessus.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deployer l API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Tant que les secrets Cloudflare ne sont pas renseignes, le workflow
      # s arrete proprement : un depot neuf ne doit pas afficher une croix rouge
      # a chaque push.
      # Deux secrets suffisent : la base D1 et le bucket R2 sont crees par le
      # script s ils manquent. Le resume nomme precisement ce qui bloque —
      # diagnostiquer depuis un telephone ne doit pas demander de lire les logs.
      - name: Verifier que Cloudflare est configure
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Les deux noms sont acceptes : un secret nomme sans le prefixe reste
          # un secret valide, et le deploiement ne doit pas dependre de ce detail.
          ANTHROPIC: ${{ secrets.CREA_ANTHROPIC_API_KEY }}${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # `if` explicites plutot que `[ ... ] && ...` : sous `set -e`, une telle
          # ligne placee en fin de bloc ferait echouer l etape quand la condition
          # est fausse. Ici, rien ne depend de l ordre des lignes.
          absents=""
          if [ -z "$TOKEN" ]; then absents="$absents CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$ACCOUNT" ]; then absents="$absents CLOUDFLARE_ACCOUNT_ID"; fi

          absents="${absents# }"

          if [ -n "$absents" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploiement ignore"
              echo ""
              echo "Secret(s) manquant(s) : **$absents**"
              echo ""
              echo "A ajouter dans **Settings > Secrets and variables > Actions**, onglet *Secrets* :"
              echo ""
              echo "| Secret | Ou le trouver |"
              echo "| --- | --- |"
              echo "| \`CLOUDFLARE_API_TOKEN\` | Cloudflare > My Profile > API Tokens — modele **Edit Cloudflare Workers** (il inclut Workers, D1 et R2) |"
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | Cloudflare > Workers > barre laterale |"
              echo "| \`CREA_ANTHROPIC_API_KEY\` | console.anthropic.com — optionnel |"
              echo ""
              echo "La base D1 et le bucket R2 sont crees automatiquement : rien a preparer dans Cloudflare."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Secrets absents : $absents — deploiement ignore, voir le resume."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            if [ -z "$ANTHROPIC" ]; then
              echo "::warning::Cle Anthropic absente (ni CREA_ANTHROPIC_API_KEY ni ANTHROPIC_API_KEY) — le moteur IA repondra 503. Verifier l onglet *Secrets*, pas *Variables*."
            fi
          fi

      - name: Installer les dependances
        if: steps.gate.outputs.configured == 'true'
        run: npm ci

      # Un deploiement ne part jamais sur du code qui ne passe pas les controles.
      - name: Verifier les types
        if: steps.gate.outputs.configured == 'true'
        run: npm run typecheck

      - name: Executer les tests
        if: steps.gate.outputs.configured == 'true'
        run: npm test

      - name: Deployer
        if: steps.gate.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CREA_D1_DATABASE_ID: ${{ secrets.CREA_D1_DATABASE_ID }}
          CREA_ANTHROPIC_API_KEY: ${{ secrets.CREA_ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CREA_SITE_URL: ${{ vars.CREA_SITE_URL }}
          CREA_WORKERS_SUBDOMAIN: ${{ vars.CREA_WORKERS_SUBDOMAIN }}
        run: node scripts/deploy-ci.mjs
